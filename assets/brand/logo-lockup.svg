<svg viewBox="0 0 300 64" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="SmartMarkers">
  <defs>
    <linearGradient id="sml-beam" x1="32" y1="5" x2="32" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7a4ff"/>
      <stop offset="0.46" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="sml-node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#dff7ff"/>
      <stop offset="0.62" stop-color="#7cc9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="sml-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.35" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- icon -->
  <g>
    <rect x="6"  y="26" width="4" height="12" rx="2" fill="#3b82f6"/>
    <rect x="14" y="20" width="4" height="24" rx="2" fill="#22d3ee"/>
    <rect x="22" y="13" width="4" height="38" rx="2" fill="#f43f5e"/>
    <rect x="38" y="13" width="4" height="38" rx="2" fill="#a855f7"/>
    <rect x="46" y="20" width="4" height="24" rx="2" fill="#22d3ee"/>
    <rect x="54" y="26" width="4" height="12" rx="2" fill="#64748b"/>
    <rect x="30.75" y="5" width="2.5" height="54" rx="1.25" fill="url(#sml-beam)" filter="url(#sml-glow)"/>
    <circle cx="32" cy="32" r="10" fill="url(#sml-node)"/>
    <circle cx="32" cy="32" r="3.2" fill="#ffffff"/>
  </g>

  <!-- wordmark: c3 styling, solid violet on "Markers", no gradient -->
  <text x="74" y="41" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-1.1" dominant-baseline="middle">
    <tspan fill="#eef0f5">Smart</tspan><tspan fill="#7c5cff">Markers</tspan>
  </text>
</svg>
