<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="SmartMarkers icon">
  <defs>
    <linearGradient id="sm-beam" x1="32" y1="5" x2="32" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7a4ff"/>
      <stop offset="0.46" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="sm-node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#dff7ff"/>
      <stop offset="0.62" stop-color="#7cc9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="sm-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.35" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- structure pulse bars: song timeline split by the cue beam -->
  <g>
    <rect x="6"  y="26" width="4" height="12" rx="2" fill="#3b82f6"/>
    <rect x="14" y="20" width="4" height="24" rx="2" fill="#22d3ee"/>
    <rect x="22" y="13" width="4" height="38" rx="2" fill="#f43f5e"/>
    <rect x="38" y="13" width="4" height="38" rx="2" fill="#a855f7"/>
    <rect x="46" y="20" width="4" height="24" rx="2" fill="#22d3ee"/>
    <rect x="54" y="26" width="4" height="12" rx="2" fill="#64748b"/>
  </g>

  <!-- vertical cue beam / shaft of light -->
  <rect x="30.75" y="5" width="2.5" height="54" rx="1.25" fill="url(#sm-beam)" filter="url(#sm-glow)"/>

  <!-- luminous node at the beat intersection -->
  <circle cx="32" cy="32" r="10" fill="url(#sm-node)"/>
  <circle cx="32" cy="32" r="3.2" fill="#ffffff"/>
</svg>
